# Long description of AtmosLab (add-on repo: atmos-lab/, customer doc: atmos-lab/docs/documentation.md).
# Images are the 4K preset renders of the showcase scenes (renders/showcase_4k on the E: drive),
# served from GitHub Pages.

headline: Add fog, haze, light shafts and a day-and-night sky to any scene in one click.
intro:
  - "**AtmosLab** fills your Blender scenes with atmosphere: haze that thickens in the valleys, ground fog that rolls with the wind, sunbeams and glowing lamp halos, and a physical sky that runs from noon through sunset to a starry, moonlit night."
  - Pick one of eight looks and AtmosLab builds the fog, the sky and a sun lamp whose direction, colour and strength match the sky at every hour. Or set a real date, time and place, and the sun, the moon and the stars go exactly where they were on that day, then watch them move in the viewport.
  - Everything is standard Blender nodes and simple drivers saved in your .blend, so scenes render without the add-on and on render farms. Your own materials are never touched.
chips: [Blender 5.0 to 5.2, Cycles & EEVEE, Real date and place, Live in the viewport, Renders without the add-on]
hero:
  src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/lake-dawn.gif
  alt: Time-lapse of a foggy lake from a starry night to the first sun behind the fir trees
video: DbFg48X-90g

stats:
  - 8: ready-made looks
  - 16: fog controls
  - 0: of your materials changed

sections:
  - type: features
    kicker: Key features
    title: Fog, light and sky from one panel
    items:
      - Volumetric haze: A fog box sized to your scene. The haze is thickest at the ground and thins out with height, the way real air does.
      - Ground fog: A separate layer that hugs the ground with a soft, broken top, from knee-high mist to fog that fills a valley.
      - Wind and turbulence: Fog patches drift and change shape over the timeline. Nothing to bake.
      - Light shafts and halos: Sunlight through trees turns into beams, and your own lamps glow through the fog.
      - Physical sky: Blender's own Multiple Scattering sky model with air, aerosol, ozone and altitude.
      - A sun lamp that matches the sky: Its direction, colour and strength follow the sun in the sky at every elevation, from white noon light to a red sunset.
      - Auto exposure: Sky and sunlight brighten as the sun goes down, like a camera, so sunsets and blue hour stay readable.
      - Time & Place: Enter a date, a time and a place. The sun, the moon and the stars follow astronomical formulas, and the moon phase and moon tilt are the real ones for that night.
      - Live Preview: Press Play and the sun and moon cross the sky in the viewport. A baked copy of the sky keeps it moving, and it switches back for the final render.
      - Night sky: Stars, a Milky Way band in its real place and the faint glow of the night sky, which also lights your scene.
      - A moon that looks like the moon: The near side from NASA's CGI Moon Kit (public domain), with its real phases, and a Moonlight lamp that casts moon shadows and light shafts.
      - One-click render settings: EEVEE volumetrics that reach the end of the fog, and four volume bounces for Cycles.

  - type: gallery
    kicker: Presets
    title: Eight looks, one click
    text:
