        caption: Valley Morning Mist
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/forest-sunbeams.jpg
        alt: Sunbeams slanting through the hazy air between tall fir trees over a forest trail
        caption: Forest Sunbeams
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/mountain-haze.jpg
        alt: Forested ridges on a clear day with blue haze softening the mountains behind them
        caption: Mountain Haze
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/golden-dust.jpg
        alt: A low sun glowing through dusty air over a dry plain with quiver trees and bushes
        caption: Golden Dust
