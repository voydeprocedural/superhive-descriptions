# Long description of OceanLab (add-on repo: ocean-lab/, customer doc: ocean-lab/docs/documentation.md).
# Images come from E:\Voyde Procedural\OceanLab\promo (tools/promo.ps1) and are served from GitHub Pages.
# "OceanLab" is the working name; the product stays `status: draft` until the name is confirmed and it is live.

headline: An animated open sea you can see into, in nine ocean types from a tropical lagoon to a storm, with lace foam, props that ride the waves and objects that push the water, live.
intro:
  - "**OceanLab** puts a real ocean under your scene. Pick an ocean type, from a tropical lagoon to a North Atlantic storm, or a sea state from a glassy calm to a hurricane, and it computes wind-driven waves the way ocean simulations do: a swell from far away, wind waves and fine ripples that never repeat, out to the horizon."
  - "The water has depth. In Cycles it is a clear surface over a volume that absorbs and scatters light, so you see the submerged part of a floating object fade into the sea, crests glow when the sun is behind them and foam casts a soft shadow into the water. EEVEE gets a matching surface version that renders in seconds."
  - "Select a buoy, a crate or any prop and press **Float**: it rises, falls, bobs and tilts with the waves, follows its own animation across the sea or drifts downwind."
  - "And the objects push back. Press **Disturb Water** and whatever stands or moves in the sea makes ripples, trails foam or lands with a splash, simulated while the animation plays. It is all Blender nodes, image sequences and keyframes, so the scene plays and renders without the add-on, and on render farms."
chips: [Blender 5.0 to 5.3, Cycles & EEVEE, 9 ocean types, 13 sea states, Water with depth, Floating objects, Live interaction, Renders without the add-on]
hero:
  src: https://voydeprocedural.github.io/superhive-descriptions/media/ocean-lab/types.gif
  alt: Nine seas in turn, each under its own sky, from deep blue open ocean and a turquoise lagoon to a grey North Atlantic swell, a storm streaked with foam, cold Arctic water, a glassy swell at sunset, a green coast and a lake

stats:
  - 9: ocean types
  - 13: sea states
  - 20 km: to the horizon

sections:
  - type: features
    kicker: Key features
    title: The open sea, from one panel
    items:
      - Nine ocean types: Open Ocean, Tropical Lagoon, Mediterranean, North Atlantic, Storm, Arctic, Glassy Swell, Green Coast and Lake. One menu sets the waves, the swell, the depth and the colour of the water together, and every value stays yours to change.
      - Swell: Long, regular waves from a storm far away, on top of what the local wind raises. With no wind at all it gives a smooth, glassy sea that still heaves.
      - Sea states 0 to 12: One dropdown on the Beaufort scale sets wind speed, fetch, choppiness and foam together. Force 2 for a lake-like calm, Force 9 for a storm.
      - As rough as the real sea: The short waves are as steep, and the whitecaps as many, as measurements at sea say they are for that wind. A gale glitters and foams like a gale, not like a calm sea scaled up.
      - Wind-driven waves: The waves come from an ocean-engineering wave spectrum. Wind speed, how far the wind has blown over open water, direction, alignment, depth and choppiness all change the shape of the sea.
      - Water with depth: In Cycles the sea refracts, absorbs and scatters light. Clarity sets how far you see into it; two colours set what it absorbs and what it glows with. EEVEE matches the colours on a fast surface version.
      - Three-layer foam: Thick white foam where a crest has just broken, a lace of veins that trails behind it, and pale aerated water around both. It follows every breaking wave, fades over seconds, and its lace keeps moving. Veins writhe, holes open and close, streaks break up and gather again, and the wind carries the foam along. One slider, Foam Motion, sets how lively it is.
      - One mesh to the horizon: Fine around the camera, growing cells further out, 20 km by default, no seams and no repeating pattern from the air. The fine area follows your camera.
      - Float: Any object rides the waves, with height offset, tilt, sway, footprint, inertia and bobbing. Float several objects at once.
      - Moving objects: Animate an object, press Float, and it stays on the water all along its way. Drift carries debris downwind.
      - Live interaction: Objects push the water as they move. Ripples spread from them, a towed object trails foam, a dropped one lands with a splash and droplets, and foam gathers along every waterline, simulated while the animation plays.
      - Current: Give the water a steady flow and it carries the foam and the ripples along, around objects and shores. Whatever stands still in it leaves a trail downstream.
      - Live Float: Tick Live and an object is moved by physics on every frame. Drag it, lift it out and drop it, let the current carry it, all while the animation plays.
      - Shores and shallows: Land is read once, so a whole terrain costs nothing per frame, and in EEVEE shallow water shows the seabed and whatever lies sunk in it.
      - Seamless loops: Bake a loop of any length for turntables and looping backgrounds.
      - Renders anywhere: The mesh, the nodes, the material, the wave images and the keyframes are plain Blender data. Copy the .blend with its cache folder and it renders without the add-on.

