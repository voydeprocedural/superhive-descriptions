  - type: features
    kicker: Key features
    title: Light, clean and ready to use
    items:
      - Lightweight geometry: Light assets for fast scene building.
      - Clean topology: Tidy meshes in every asset.
      - Organized asset panel: Every asset sits in one simple panel for quick access inside Blender.
      - Ready-to-use materials: Assets come with their materials set up.
      - Real-time ready: Optimized for real-time and game scenes.
      - Cycles and EEVEE: Works with both render engines.
