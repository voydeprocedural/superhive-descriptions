  - 6: material presets
  - 4: animation tools

sections:
  - type: gallery
    kicker: New in 1.3
    title: Grow over a surface
    text:
      - Start at an origin and watch the cloth spread over an object. Tendrils reach ahead of a ragged edge, writhe, then settle onto the surface and knot into the fabric. Adjust **Origin** and **Tendrils** to shape the effect.
    items:
      - src: https://assets.superhivemarket.com/cache/ac3b874556496dcdcfc42fa22fb5540f.jpg
        alt: Grow animation spreading knit fabric across a black egg
        caption: Fabric spreading over the surface.
      - src: https://assets.superhivemarket.com/cache/f444834585e50b1e302239262668be35.jpg
        alt: Egg completely covered by knitted fabric after Grow
        caption: The fully covered result.

  - type: gallery
    kicker: New in 1.3
    title: Watch every pick on the Loom
    text:
      - Cloth flows from a weaving line at a steady speed. The warp opens into a shed, a shuttle carries each pick across from alternating sides, and the weft is beaten in. Add the optional satin-black **Loom Head**, adjust Head Size, or turn the head off to see the weaving itself.
      - Combine Loom with **Wrap Onto Surface** to weave over your target row by row. The machine head becomes a band that follows the surface, leaving fabric behind it as it moves.
    items:
      - src: https://assets.superhivemarket.com/cache/4d0e11715135bd957bff08df292a3aeb.jpg
        alt: Woven fabric emerging from a satin-black Loom Head
        caption: Loom Head, a machine housing for the weaving animation.
      - src: https://assets.superhivemarket.com/cache/d7c2302fca6fb08a0f9ccf7ee5003302.jpg
        alt: Loom band weaving fabric onto a vase
        caption: Surface weaving, with cloth building directly over the target object.

  - type: feature
    kicker: New in 1.3
    title: Knit (Jersey) with real interlocking loops
    text:
      - One yarn per course loops through the next to form the familiar V stitch. Build knitted bands, sleeves and machine-knit looks, with plies, fibers, fuzz, color, wrapping and Loom animation. Fringe and knots apply to woven patterns.
    media:
      src: https://assets.superhivemarket.com/cache/790572dc5c7f2117264b37aa45c3ba31.jpg
      alt: Jersey knit fabric flowing out of a black knitting machine

  - type: gallery
    kicker: New in 1.3
    title: Get closer with Fibers
    text:
      - Split every ply into fine fibers with loose flyaway loops for close-ups and macro shots. Ply twist and fibers stay attached to the yarn as the cloth moves, wrapped cloth rests above the surface, and fuzz is smoother.
    items:
      - src: https://assets.superhivemarket.com/cache/3f35694471e16047d58a7e4019572591.gif
        alt: Animated macro view of yarn plies and individual fibers
        caption: Fine strands and flyaway loops in motion.
      - src: https://assets.superhivemarket.com/cache/d06af3c01a769c2b540c2528fae292d2.jpg
        alt: Macro still showing fine fibers within a yarn
        caption: Fiber-level detail for close-ups and macro renders.

