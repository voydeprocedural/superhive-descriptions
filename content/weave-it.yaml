  - type: feature
    kicker: Wrapping
    title: From flat weave to 3D form
    text:
      - Wrap your weave onto shaped objects with **UV-based, Spherical and Cylindrical wrapping**. Follow a cushion, curved surface or rounded form while keeping the weaving controls editable.
      - Automatic surface-size matching adapts the overall weave dimensions to your target. Wrap by UVs on complex meshes, where yarns stop at UV seams instead of bridging through the object, or use Spherical and Cylindrical projection for rounded forms without UVs. For UV-based wrapping, a continuous island with even scale gives the most consistent strand placement.
      - Surface wrapping follows your target geometry. It does not calculate cloth physics or collisions.
    media:
      src: https://assets.superhivemarket.com/cache/00731af5f38f22fc8b1e8a8e913ffe2a.gif
      alt: A flat blue and red plaid weave morphing onto a 3D surface with Wrap Morph

  - type: features
    kicker: Strand controls
    title: Control the character of every strand
    items:
      - Twisted yarns: Use 1-8 plies per yarn and adjust twist amount, direction and flattening.
      - Round yarns or flat strips: Change Profile Shape to move between thread, wire, ribbon and straw-like profiles.
      - Fiber-level detail: Split plies into fine fibers with count, twist, thickness, flyaway and core controls, and add fuzz with density, length, thickness and frizz.
      - Frayed edges: Use edge selection and Add Fringe, then tune length, variation, droop, unraveling and tip fibers.
      - Color, stripes and plaid: Control warp and weft colors independently, add stripes in either direction and introduce per-strand variation.
      - Matching fiber color: Fuzz follows its parent yarn, including its stripes and color variation.
      - Real knots: Tie knots at every crossing or every Nth crossing for nets and macramé.
      - Openness: Space the yarns apart.

  - type: specs
    kicker: Animation
    title: Make the weave move
    text:
      - Four built-in animation tools build, wrap and animate your material.
    items:
      - Weave Build: Three styles. Grow spreads cloth from an origin with animated tendrils, Loom weaves with a shed, shuttle and optional machine head, and Reveal keeps the original row-by-row animation.
      - Wrap Morph: Transitions a flat weave onto an assigned surface.
      - Wind: Adds movement to fringe and fibers.
      - Ply Spin: Rotates plies around the yarn.
      - Keyframes: Settings support keyframes. Use the diamonds beside values, or record the setup with **Keyframe All Settings**.

  - type: features
    kicker: Workflow
    title: A flexible Blender workflow
    items:
      - Single modifier: The procedural setup runs through a single Geometry Nodes modifier, with controls in the Weave It panel.
      - Keep editing: Add a preset, refine the weave and change settings at any time in a fully procedural, non-destructive workflow.
      - Simplify Viewport: Reduces editing detail while keeping full detail for rendering.
      - Shader attributes: Yarn color, random values, strand indices, fringe factors and yarn coordinates are exposed for custom materials.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Updating from 1.2?": Existing files keep working. Use **Update Fabrics** in the panel to upgrade them while keeping their settings. The original build animation remains available as Reveal.
      - "How do I render fuzz and fringe fibers?": Use the add-on's preset creation tools to create the correct Hair Curves object for rendering them.
      - "How heavy is it to render?": High strand counts, multiple plies and dense fibers increase geometry and render cost. Keep Simplify Viewport enabled while editing, and choose a detail level appropriate for your camera distance.

  - type: facts
    kicker: Details
    title: What you get
    cards:
      - title: Included
        items:
          - "`WeaveIt_Extension_v1.3.0.zip`, the installable add-on including demo scenes. Install the ZIP directly without extracting it."
          - Six presets (Wool, Nylon, Metal Mesh, Straw, Open Weave and Knotted Net)
          - Eight woven patterns plus Knit (Jersey), and four built-in animation tools
          - "`WeaveIt_Demo_Scenes_v1.3.zip`, the demo file as a separate download, with the studio swatch, draped fabric, six presets, Reveal animation and five new scenes (Loom Demo, Fiber Close-up, Surface Weave Demo, Knit Machine Demo and Cinematic Wrap). Open them from the sidebar with **Open Demo Scenes**."
          - Documentation and a sidebar panel with every setting, Add Fringe, per-edge fringe controls and keyframe buttons
      - title: Requirements
        items:
          - Blender 5.1 or newer
          - Tested in Blender 5.1.2, 5.2.0 LTS and 5.2.2 LTS
          - Cycles recommended. Yarn geometry and hair-based fibers also support EEVEE.
      - title: License
        items:
          - Add-on code under GPL-3.0-or-later
          - Demo scenes and assets may be used in personal and commercial renders, animations and games
          - Developed with assistance from an AI coding assistant
