  - type: pair

  - type: feature
    kicker: Rig2Motion Studio
    title: Its own interface, inside the 3D View
    text:
      - One floating panel next to your character, with every step on a rail on its left. The skeleton types and the game engines are cards, and the whole motion library plays at once, so you can pick a walk by looking at it.
      - Prefer Blender's sidebar? Everything in the Studio is also in the **N** panel, and the two share their settings.

  - type: steps
    kicker: Quick start
    title: Rigged and moving in seven clicks
    items:
      - Select every mesh of your character in Object Mode (body, clothes, hair, eyes).
      - In the Rig2Motion tab (or Rig2Motion Studio), click your skeleton type, then **Create Skeleton**.
      - "Optional: **Edit Skeleton**, drag the coloured joint dots onto the joint centres, then **Finish Editing**."
      - Click **Bind**. **Show Bone Colors** shows which bone moves which part.
      - Click a motion card to play it on your character, then **Add** to keep it.
      - "Optional: put a sword, a gun or a shield in either hand under **Props**."
      - Pick Unreal, Unity, Godot or FBX and click **Export**.

  - type: steps
    kicker: Installation
    title: Install in a minute
    items:
      - Download `rig2motion-0.8.0.zip` from your Superhive library. Do not unzip it.
      - Drag and drop the zip into the Blender window, or go to **Edit → Preferences → Get Extensions**, open the **⌄** menu at the top right and choose **Install from Disk**.
      - The add-on is enabled at once. Open the sidebar (**N**) and the **Rig2Motion** tab, or click **Rig2Motion Studio** in the 3D View header.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Does my character need to be in a T-pose?": A T-pose or an A-pose works for the Human skeleton. The character can face any of the four horizontal directions; Rig2Motion tells which way from the geometry.
      - "My character is already rigged. Can I re-rig it?": Yes. Select its meshes and create the skeleton; Rig2Motion fits the rest shape, and Bind takes the old skeleton's modifier off and tells you.
      - "Do my files need Rig2Motion to play?": No. The rig is Blender's own constraints and drivers without Python, so it plays and renders on any computer and on render farms.
      - "Can I use the animations in a commercial game?": Yes. The animations and props that come with Rig2Motion can be used in personal and commercial projects, including games you sell.
      - "How heavy can my mesh be?": A 170,000-vertex character binds in about 4 seconds and a 660,000-vertex one in about 8, on an RTX 4060 and Ryzen 7 3700X class computer.
      - "Does it need an internet connection or an account?": No. Everything runs inside Blender, including AI Assist, the optional landmark models that refine shoulders, elbows and fingers.

