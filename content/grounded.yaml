  - type: specs
    kicker: Performance
    title: Fast by default, full detail in the render
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/budget.gif
      alt: The viewport budget is typed into the sidebar, the field thins out, and Camera View Only spends the same budget on what the camera sees
    text:
      - Measured on a 1 km by 1 km terrain with the Wildflower Meadow biome, Blender 5.2, Ryzen 7 3700X, RTX 4060. Times are for updating every layer in the viewport.
    items:
      - Everything, what the render gets: 5,030,869 instances, 6.9 s.
      - Viewport budget 400,000 (default): 332,611 instances, 0.8 s.
      - Budget and camera view only: 312,618 instances, 0.5 s.

  - type: specs
    kicker: Bake and share
    title: Your scatter goes where you need it
    items:
      - Save as Biome: Save your layers, and they appear in the biome picker in every file.
      - Make Real: Turn a layer into a real mesh.
      - Transforms: Write every instance to CSV or JSON.
      - Unreal and Unity: Export a folder of FBX meshes, a transforms table and an import script. The scripts are written for Unreal Engine 5.3 and later, Unity 2022.3 LTS and Unity 6, and have not been run inside those engines yet; the FBX files and the table are complete on their own.
      - Asset Browser: Scatter straight from your own Asset Browser library.
      - Voyde add-ons: TerrainLab, AtmosLab and Cityform are recognized when you have them. Grounded works the same without them.

  - type: chips
    kicker: Perfect for
    title: Where it fits
    items: [Landscapes and environments, Architectural visualization, Game and film backgrounds, Street and city dressing, Product and diorama ground, Animated scenes with wind, Seasons and weather changes]

  - type: steps
    kicker: Installation
    title: Up and running in a minute
    items:
      - Download the zip from your Superhive library. Do not unzip it.
      - In Blender open Edit, Preferences, Get Extensions, the menu at the top right, Install from Disk, and pick the zip.
      - Open the sidebar in the 3D viewport with N and click the Grounded tab.
      - Select your ground, pick a biome and click Add Biome. For your own assets, select them, then the ground last, and click Scatter Selected or Auto Ecosystem.

  - type: faq
    kicker: FAQ
    title: Questions
    items:
      - "Do I need Grounded to render my scenes?": No. Every setting lives in Geometry Nodes modifiers and materials saved in your file, so it renders the same on a render farm or another computer, with keyframed seasons and weather too.
      - "Will it slow down my viewport?": The viewport budget caps what the viewport shows (400,000 by default, shared between layers) while renders get everything. Rules that are off cost nothing, and camera culling, thinning and box or point display help on very large scenes.
      - "Which Blender versions are supported?": Blender 5.0 and newer. It is tested on 5.0, 5.1 and 5.2.
      - "Can I use my own assets?": Yes. Select any meshes or collection instances, then the surface, and use Scatter Selected or Auto Ecosystem. One click adds season and weather to their materials.
      - "Does it work with Cycles and EEVEE?": Yes, the result is regular instances that both engines render, and season, snow and wetness work in both.
      - "Can I use the included assets commercially?": Yes. 384 of the 395 models are CC0, from Poly Haven, ambientCG, BlendSwap (license as declared by the uploader) and Smithsonian Open Access. The other 11 are made by Voyde Procedural and ship under the add-on's GPL license. Sources are listed in the add-on's CREDITS file.
      - "Can I make my own biomes?": Yes. Set up layers on a surface, click Save as Biome, and it appears in the biome picker in every file. Copy its two files to share it.

  - type: facts
    kicker: Details
    title: What you get
    cards:
      - title: Included
        items:
          - Grounded add-on (Blender extension)
          - 12 biomes, 164 assets with 395 models, 384 of them CC0
          - Demo file with one scene per biome
          - Documentation
      - title: Compatibility
        items:
          - Blender 5.0 or newer
          - Tested on Blender 5.0, 5.1 and 5.2
          - Windows, macOS and Linux
          - Cycles and EEVEE
          - The add-on code is licensed under GPL-3.0-or-later.

  - type: more
