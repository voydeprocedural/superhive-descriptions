  - type: pair

  - type: feature
    kicker: How it works
    title: Bake once, play
    text:
      - "Add the ocean, pick an ocean type or a sea state and bake. The waves are computed for your frame range and written as three small image sequences next to your .blend file. Then press Play: the mesh displaces in the viewport and in the render, and the material samples the same images for ripples and foam."
      - Wave Scale, Foam Coverage, the colours, Clarity and the mesh detail change instantly. Wind, fetch, direction, seed and the foam settings take a new bake, under a minute for a 240-frame animation at the default resolution.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/ocean-lab/ui-ocean.jpg
      alt: The Blender window with the ocean in the viewport and the OceanLab panel open in the sidebar

  - type: specs
    kicker: Wind, waves and look
    title: Shape the sea
    items:
      - Type: One of nine ocean types. Sets the sea state, the swell, the depth and the colours of the water in one go.
      - Sea State: Beaufort force 0 to 12. Sets the wind, the fetch, the choppiness and the foam in one go.
      - Swell Height, Length and Angle: Long waves from far away, as high and as long as you say, at any angle to the wind.
      - Wind Speed and Fetch: How hard the wind blows and how far it has blown over open water. Longer fetch, longer and higher waves.
      - Wind Direction and Alignment: Where the waves travel, and whether the sea is confused or all one swell.
      - Choppiness: Horizontal push of the crests, for sharper, steeper waves.
      - Height Scale and Depth: An overall height multiplier, and shallow water that slows and shortens the waves.
      - Foam Amount, Softness and Fade: How easily crests break, how soft the edge is, and how long whitecaps last. Foam Coverage and the foam colour change without a bake.
      - Deep Water, Wave Glow, Glow Strength, Clarity and Seabed: The colours the water absorbs and scatters, how bright it is, how far you see into it and what lies under a shallow sea.
      - Resolution and tiles: 128 for previews, 256 by default, 512 for close-ups, plus the tile size of each wave layer.
      - Mesh: Follow object, detail radius and spacing, horizon distance and rows, Wave Scale.
      - Interaction: The collection of objects, the area around the Follow object, Reaction, Ripple Speed, Calming, Smoothing, Foam and Foam Fade, Droplets, Current and Current Direction, a Land collection for what never moves, and Bake Ripples for render farms.

