    kicker: Perfect for
    title: Where it fits
    items: [Food and dessert renders, Cosmetics product shots, Paint and drip art, Slime and horror FX, Oil and grease on props, Motion graphics loops]

  - type: steps
    kicker: Installation
    title: Up and running in a minute
    items:
      - Download `drip_lab-1.0.0.zip` from your Superhive library. Do not unzip it.
      - Drag the zip into Blender, or go to **Edit ▸ Preferences ▸ Get Extensions**, open the **⌄** menu at the top right and choose **Install from Disk**.
      - Press **N** in the 3D Viewport and open the **DripLab** tab.
      - Select an object, pick a preset and press **Pour**, then play the timeline. Or press **Add Fluid** and draw on the object.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Is the simulation real?": Yes. It runs on Mantaflow, the liquid solver built into Blender, with nothing extra to install. DripLab sets it up for product shots; you bake it like any Blender simulation, and the bake is a folder next to your .blend file.
      - "Can I change a simulation after baking it?": "Yes: press **Free Bake**, change the settings or the preset, and bake again. Liquid Film and the toppings stay editable on a bake."
      - "Do painted fluids need baking?": No. They are Geometry Nodes driven by the frame, so every frame can be scrubbed, re-timed and changed at any moment.
      - "Cycles or EEVEE?": Both. The materials are procedural, and the wet layer uses blended transparency in EEVEE.
      - "Is it heavy on the viewport?": Fluids are meshed from a volume. Lower **Quality ▸ Resolution Viewport** while you work and keep **Use Render Resolution** on for full detail in renders. Animated fluids update on every frame of playback, so hide the ones you are not working on or turn finished ones into meshes.
      - "Does the file render without the add-on?": Yes. Fluids are Geometry Nodes and materials stored in the .blend file, so it also renders on a machine or render farm without DripLab.
      - "Does it work on animated objects?": "Yes: **Stick to an animated object** binds a fluid to a deforming mesh with Surface Deform or armature weights, and **Unstick** brings the editable fluid back."
      - "Which Blender versions?": Blender 5.0 or newer. It was tested on Blender 5.0, 5.1 and 5.2.
      - "Can I use it in commercial work?": Yes. Your renders and animations are yours to use in any project.

