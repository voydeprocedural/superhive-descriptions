# Long description of Cityform (called City Builder before 1.0). Images live in site/media/cityform/ on GitHub
# Pages until the Superhive gallery copies exist; swap to assets.superhivemarket.com links after the upload if wanted.

headline: A whole city in one click, from the glass towers to the chimneys on the roofs.
intro:
  - "**Cityform** builds a complete procedural city in Blender: towers downtown, mid-rise apartment and office blocks, shopping streets, suburbs with gardens and pools, parks, and a far city that runs on to the horizon. Every street gets kerbs, footways, trees, lamps, signals and furniture."
  - "The buildings are assembled from a real modular kit, with moulded windows, cornices, tiled and metal roofs, dormers, rear wings and streets that are not ruled with a straight edge. Draw your own roads, curved or at any angle, and Cityform builds the blocks between them. One click switches the whole city to a style, from a glass metropolis to a European old town or a wet night."
chips: [One click, Your own roads, 5 city styles, 9 real skies, Far city to the horizon]
hero:
  src: https://voydeprocedural.github.io/superhive-descriptions/media/cityform/hero.jpg
  alt: Aerial view of a Cityform city at golden hour, towers in the centre, tiled roofs running to the horizon

stats:
  - 5: city styles
  - 9: real skies
  - 9: building types
  - 3: viewport quality levels

sections:
  - type: features
    kicker: Key features
    title: Everything a city needs
    items:
      - Districts in rings: Towers in the centre, mid-rise blocks, shopping streets and suburbs further out, with parks among them. Each district is its own object with its own settings.
      - City from Roads: Draw road centre lines as a mesh or a curve. Every area they enclose becomes a block, curved and diagonal streets included.
      - A real building kit: Moulded windows, doors, cornices, crowns and fire escapes from a CC0 modular kit. The window grid fits each wall, so a corner never cuts a window in half.
      - Roofs, not boxes: Hip, gable, lean-to and mansard roofs, gables facing the street, dormers, chimneys, clay tile, slate and corrugated metal that rusts with age.
      - Streets with rhythm: Buildings step back and turn a little on their lots, and lower wings at the back break up each block. Both have their own slider.
      - Far City: The street grid goes on for up to nine kilometres as one light mesh, so an aerial shot ends at the horizon and not at the edge of the model.
      - Rivers and bridges: Turn the middle of the city into a river with quay walls, grass banks and a bridge for every street that crosses it.
      - One-click styles: Modern Metropolis, European Old Town, Sunbelt, Night City and Gritty set the buildings, streets, sky and weather together.
      - Real skies, haze and fog: Nine sky photographs with a matching sun, aerial haze that costs no render time, and a box of height fog when you want one.
      - Nights that look like nights: Each window gets its own lamp colour and curtain, offices run on cool tubes, and street lamps near the camera are real lights with shadows that stop at the walls.
      - Age, Wetness and Lit Windows: Three scene-wide sliders take the city from new to run down, from dry to rain-soaked and from day to night.
      - Viewport friendly: Pick Full, Balanced or Light in the panel. Level of detail follows the camera, and a Real-time Look button sets up EEVEE.

