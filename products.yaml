# Single source of truth for every Voyde Procedural product on Superhive.
#
# The card widgets (site/widget/) read the JSON built from this file, so a change here reaches every
# Superhive description after a push, without touching Superhive. The long description of each product
# lives in content/<id>.yaml and is rendered to descriptions/<id>.html for pasting into Superhive.
#
# Products are listed newest first. Only `status: published` products appear in other products' cards.

store:
  name: Voyde Procedural
  tagline: Procedural tools & terrains for Blender
  superhive: https://superhivemarket.com/creators/toprak-tatveren
  website: https://voydeprocedural.com
  pages: https://voydeprocedural.github.io/superhive-descriptions/
  socials:
    x: https://x.com/voydeprocedural
    instagram: https://instagram.com/voydeprocedural
    # youtube: https://www.youtube.com/@...   # add the channel URL to show the button

# Superhive bundles, promoted in the "More from the studio" card of every description.
# image: 1200x600 cover in site/img/. includes: product ids in the bundle (the card says "Also in ..." on those).
bundles:
  - id: nexus
    name: Voyde Nexus Bundle
    tagline: 16-in-1 Blender Creation Suite
    url: https://superhivemarket.com/bundles/voyde-nexus-bundle---16-in-1-blender-creation-suite
    image: img/bundle-nexus.webp
    includes: [depthforge, blendbuddy, weave-it, skyflow, gobolab, ultimate-terrain-addon, smart-scatter-kit,
      procedural-generator-bundle, arc-forge, surface-forge, ultimate-terrain-pack, freezing-effect,
      instant-terrain-importer, trash-scatter, terrain-materials-pack, nature-starter-pack]

# How products of one category recommend the others, in order of preference.
categories:
  terrain: { label: Terrain, related: [scatter, light, gn] }
  gn: { label: Geometry Nodes, related: [gn, scatter, terrain] }
  scatter: { label: Scatter & Assets, related: [terrain, scatter, gn] }
  light: { label: Lighting & Sky, related: [light, terrain, scatter] }
  tools: { label: Tools & Helpers, related: [tools, gn, light] }

# Fields
#   id            short key: content/<id>.yaml, descriptions/<id>.html, site/img/<id>.webp
#   superhive     product slug on superhivemarket.com/products/<slug>
#   kind          Add-on | Geometry Nodes | Asset Pack | Material Pack | Bundle
#   blender       supported Blender versions as shown on the cards
#   summary       one or two sentences, shown on cards in other descriptions
#   badges        2-3 short facts shown on cards
#   pairs         hand-picked products to recommend first (the "Pairs well with" card rotates through the first three)
#   flag          optional ribbon on the card cover, e.g. NEW or BESTSELLER
products:
  - id: atmoslab
    name: AtmosLab
    tagline: Volumetric Fog & Day-Night Sky
    superhive: atmoslab-volumetric-fog-and-day-night-sky
    category: light
    kind: Add-on
    blender: "5.0+"
    summary: Add haze, rolling ground fog, light shafts and a physical sky that runs from noon to a starry, moonlit night, with a sun lamp that always matches the sky.
    badges: [8 presets, Moon with real phases, Renders without the add-on]
    pairs: [cloud-sketch, gobolab, ultimate-terrain-pack]
    flag: NEW
    status: published

  - id: crawlers
    name: Crawlers
    tagline: Lifelike Creature Swarms
    superhive: crawlers
    category: gn
    kind: Add-on
    blender: "5.0–5.2"
    summary: Real-size earthworms, ants, spiders, cockroaches, centipedes, maggots and snakes. Pick them from a picture catalog, draw their path or lure them with the mouse.
    badges: [7 creatures, 11 skins, Geometry Nodes]
    pairs: [nature-starter-pack, smart-scatter-kit, ultimate-terrain-pack]
