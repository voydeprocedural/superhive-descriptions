  - type: specs
    kicker: Technical details
    title: Under the hood
    media:
      src: https://assets.superhivemarket.com/store/productimage/1234182/image/xlarge_og-6fd4eb242c96bb121e8753a84e8fa889.png
      alt: The Ice Shelf snow terrain in the viewport with the Terrain Importer panel showing grid size, texture override and modifier controls
    items:
      - Displacement: Through a Subdivision modifier, non-destructive.
      - Textures: 4K PBR textures included (Diffuse, Normal, Roughness, Displacement).
      - Base grid: 32x32 quads, fully scalable.
      - Grid size: 100 m by default, adjustable.
      - Setup: Automatic path detection, zero manual setup.
      - Dependencies: No external dependencies.
      - Interface: A single panel in the N-panel sidebar.

