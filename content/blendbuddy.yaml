# Long description of BlendBuddy. Text kept from the Superhive description of 2026-11-02
# (archive/2026-11-02/blendbuddy.html), restructured into the shared layout.

headline: A tiny pixel pet that lives in your viewport, helps you with Blender and tells you when your render is done, on your desktop and on your phone.
intro:
  - Blender sessions can be long and lonely. **BlendBuddy** gives you a little friend who walks and hops all over your viewport, plays with its buddies, reacts when you pet it, fixes common scene problems in one click and pops out on your desktop the moment a long render finishes.
chips: [30 pixel characters, Up to 3 extra buddies, One-click scene fixes, Desktop & phone render alerts]
hero:
  src: https://assets.superhivemarket.com/cache/389f4567fc80eb7e55fe0dad96840cef.gif
  alt: Bit, a pixel fox, saying hi in the Blender viewport and doing a trick when petted
video: 3CKu7mmw3L0

stats:
  - 30: pixel characters
  - 3: extra buddies
  - 4: pet sizes

sections:
  - type: feature
    kicker: Characters
    title: 30 hand-made pixel characters
    text:
      - Fox, Dragon, Panda, Frog, Ember, Robot, Bunny, Moon, Pumpkin and many more. Every character has **front, side and back views**, so it walks, runs, turns around and naps.
      - The **Halloween Edition** adds 10 spooky extras, for 40 characters in total.
    media:
      src: https://assets.superhivemarket.com/cache/3a50f8b418aee10e20fc14a8810b4362.png
      alt: All 30 BlendBuddy pixel characters in a grid, from Ember and Droplet to Moon and Pumpkin

  - type: specs
    kicker: Customize
    title: Make it yours
    media:
      src: https://assets.superhivemarket.com/cache/0ffa51af6f3c46d07b4eb55e6f3e60e1.png
      alt: The fox recolored six ways with Color Shift, characters wearing hats, a crown and a bow, and four simple pets made with Build Your Own
    items:
      - Color Shift: Recolor any character while its skin and eyes stay the same.
      - Accessories: Party hat, top hat, crown, bow, headphones or flower, in any color.
      - Build Your Own: Make a pet from simple parts, or load your own sprite sheet.
      - Sizes: Four sizes, from Small to Huge.
      - Name: Give your pet a name, and it uses it everywhere.

  - type: feature
    kicker: Pet it
    title: A different reaction every time
    text:
      - "Click your pet (or the heart button) and it does a random trick: **hop, roll, backflip, wiggle, spin, dance, zoomies, squish** or a shower of hearts. It never does the same one twice in a row."
    media:
      src: https://assets.superhivemarket.com/cache/a06c81e21e614465263b2e73866cf98c.png
      alt: The fox pet doing eight tricks - hop, roll, backflip, squish, dance, zoomies, spin and hearts

  - type: gallery
    kicker: Movement
    title: Drag it anywhere
    text:
      - "Your pet walks and hops all over the viewport. Hold and drag it anywhere: its legs run while you carry it, and it leaves a **sparkle or wind trail** in its own color."
      - Prefer a calm viewport? Keep it on the bottom edge, or choose **Stay Put** and it stays where you drop it.
    items:
      - src: https://assets.superhivemarket.com/cache/1a544357924d472145e95980641bc54c.gif
        alt: The fox pet walking and hopping across the viewport next to the BlendBuddy sidebar panel
      - src: https://assets.superhivemarket.com/cache/2c861ff898b1b4f44345f6a0b3dafaff.gif
        alt: The fox pet being dragged through the viewport, running and leaving a sparkle trail

  - type: feature
    kicker: Friends
    title: Bring friends
    text:
      - Add up to **3 extra buddies**, picked by you or at random. They say hi, **play tag, do tricks together, play follow-the-leader**, leapfrog over each other, throw little dance parties and nap together when you take a break. Click any of them to pet it, or drag it around.
    media:
      src: https://assets.superhivemarket.com/cache/78028c9019ae3a2e79a32867d5c1c97f.gif
      alt: The fox pet greeting a frog and a panda buddy, then playing together in the viewport

  - type: feature
    kicker: Sounds
    title: Sounds and music
    text:
      - Every trick, jump, landing, pick-up and drop has its own little sound. Turn on soft **footsteps**, or the looping **8-bit song from the video** with its own volume.
      - Footsteps and music are off by default. All sounds can be turned down or off.
    media:
      src: https://assets.superhivemarket.com/cache/4acf5feb20eb1f4d0029f0140ef20977.gif
      alt: The sound and music volume settings in the sidebar while the pets do tricks in the viewport

  - type: chips
    kicker: Scene Doctor
    title: Click for help
    text:
      - Stuck? Click your pet. It checks your scene for common problems like these and fixes many of them with one click. Use **Ask me…** to search quick answers to everyday Blender questions.
    items: [No active camera, Unapplied scale, Missing (pink) textures, No lights and a dark world (black render)]
    media:
      src: https://assets.superhivemarket.com/cache/47ad4d2a79c7f8220f7187609c679f08.gif
      alt: The Scene Doctor popup listing a missing camera and unapplied scale, with one-click fix buttons

  - type: features
    kicker: Render alerts
    title: Never miss a render
    items:
      - Desktop pet (Windows): Send your pet out of Blender and onto your desktop. It stays wherever you drop it, and a double-click makes it fly up or fall down. If Blender is in the background when a render finishes, your pet pops up above the taskbar to tell you.
      - Desktop notification: A notification and a cute sound when a render or bake finishes.
      - Phone notifications: Through Discord, every finished render arrives on your phone with a picture, the file name and how long it took.
      - Only long renders: Get notified only for renders longer than a set time, and choose whether bakes count too.
    media:
      src: https://assets.superhivemarket.com/cache/df5423d2324c8f1768e302000dbf9189.gif
      alt: The pet popping up above the taskbar when a render finishes, and the same alert arriving on a phone through Discord

  - type: steps
    kicker: Phone notifications
    title: Discord setup in about a minute
    text:
      - A step-by-step guide is also built into the add-on, under **How do I get the link?**
    items:
      - In Discord, create a private server just for you (free).
      - Open a channel's settings > **Integrations** > **Webhooks** > **New Webhook** > **Copy Webhook URL**.
      - In Blender, go to **N panel > BlendBuddy > Phone Notifications** and press the paste button.
      - Press **Send Test Message**. That's it!

  - type: steps
    kicker: Installation
    title: How to install
    items:
      - Download `blendbuddy-1.6.1.zip`, or `blendbuddy-1.6.1-halloween.zip` for the Halloween Edition.
      - In Blender, go to **Edit > Preferences > Get Extensions**, open the dropdown menu, choose **Install from Disk…** and pick the zip.
      - Open the 3D Viewport sidebar (**N**) and the **BlendBuddy** tab. Say hi to your new buddy!

  - type: facts
    kicker: Details
    title: Requirements
    cards:
      - title: Requirements
        items:
          - Blender 4.2 or newer (installs as a Blender extension)
          - "**Desktop pet:** Windows. Everything else works on Windows, macOS and Linux."
          - "**Phone notifications:** a free Discord account, with **Allow Online Access** turned on in Preferences > System > Network"
      - title: Good to know
        items:
          - Your webhook link is saved only in Blender's preferences on your computer. It's never sent anywhere except your own Discord channel.
          - Phone notifications use Discord, a third-party service. If you're active in Discord on your PC, Discord may hold the phone alert until you're away. The built-in guide shows how to change that.
          - BlendBuddy never blocks Blender. If the internet or Discord is down, your render isn't affected, and the panel tells you what went wrong.
