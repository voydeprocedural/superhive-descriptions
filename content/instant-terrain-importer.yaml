# Long description of Instant Terrain Importer. Text kept from the Superhive description of 2026-11-02
# (archive/2026-11-02/instant-terrain-importer.html), restructured into the shared layout.

headline: Import, set up and render terrains in seconds.
intro:
  - Stop wasting hours on manual terrain setup. **Instant Terrain Importer** handles import, shading, displacement and texturing in a single click.
  - It is built for Blender artists who want to go from raw heightmap to render-ready scene without touching a single node.
chips: [20 terrains, Auto PBR shaders, Cycles & EEVEE, Non-destructive, N-panel workflow]
hero:
  src: https://assets.superhivemarket.com/cache/91e63a513216c472c67a0f2ebbc3116b.gif
  alt: Picking a terrain preset in the Terrain Importer panel and importing it into the viewport with one click

stats:
  - 20: terrains included
  - 4: terrain types

sections:
  - type: features
    kicker: Key features
    title: One click, full terrain
    items:
      - One-click import: Bring a terrain into your scene with a single click.
      - Automatic PBR shaders: A procedural shader system for Snow, Rock, Desert and Volcano terrains.
      - 20 terrains included: High-quality terrains ready to import.
      - Non-destructive displacement: Displacement runs through a Subdivision modifier.
      - Live control sliders: Adjust Subdivision, Strength and Mid Level live.
      - Texture Override: Swap in your own custom textures.
      - Emissive lava: A glowing lava system on Volcano terrains.
      - Zero setup: Automatic path detection, nothing to configure.
    media:
      src: https://assets.superhivemarket.com/cache/63987758d46ca723f38a8149d3610e86.gif
      alt: Swapping the textures of an imported rock terrain with Texture Override, turning it into sandy ground

  - type: steps
    kicker: How it works
    title: From preset to render-ready
    media:
      src: https://assets.superhivemarket.com/store/productimage/1234177/image/xlarge_og-c8906945d96fdc5eca64c996d3ecfbed.png
      alt: The Terrain Importer panel with each part labelled, from preset selection and import settings to texture override and modifier controls
    items:
      - "**Pick a terrain** from the built-in preset library."
      - "**Hit Import** - displacement and subdivision are set automatically."
      - "**The shader applies itself** - no node setup, no manual linking."
      - "**Tweak or override** - adjust the sliders or swap in your own textures at any time."

