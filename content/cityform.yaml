  - type: feature
    kicker: The panel
    title: One tab for the whole city
    text:
      - "Everything is in the **Cityform** tab of the sidebar: build a city, pick a style, set the sky and mood and the viewport quality, and find every setting of the selected city object grouped as in its modifier."
    media:
