  - type: feature
    kicker: Pour at an angle
    title: Aim it like a real pour
    text:
      - Move the source to aim and rotate it to pour from the side. The stream leaves along the arrow and arcs down; **Pour Speed** sets how far the arc reaches.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/driplab/angled-pour.gif
      alt: Toxic green slime poured from the side arcs onto a dark rock and drips down, leaving a wet halo

  - type: feature
    kicker: Wetness
    title: The surface soaks it up
    text:
      - Turn on **Wetness** and the surface around the fluid looks wet, darker and glossy, fading out over **Wet Spread**. It follows the fluid live, so a pour leaves a growing wet halo.
      - The surface object and its material are not changed. The wet look is a thin transparent layer that belongs to the fluid, so it works with any material in Cycles and EEVEE. **Wet Stain** lets the colour of the fluid soak in.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/driplab/wetness.jpg
      alt: The same slime-covered rock with Wetness off on the left and on the right, where the rock around the slime is darker and glossy

  - type: specs
    kicker: Presets
    title: 43 presets in six categories
    text:
      - Every preset is a starting point. Its settings stay editable in the sidebar, and you can apply another preset to a fluid without losing its strokes, surface or pour.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/driplab/presets.jpg
      alt: Grid of the 43 DripLab presets, each shown on a small dark puck
    items:
      - Basic: Plain Drip, Plain Coat.
      - Desserts: Dark Ganache, Mirror Glaze, Birthday Glaze, Matcha Glaze, Milk and White Chocolate Drizzle, Salted Caramel, Hot Fudge, Strawberry Coulis, Lemon Curd, Royal Icing, Whipped Cream.
      - Sauces & Food: Wildflower Honey, Melted Cheese, BBQ Sauce, Sriracha, Balsamic Reduction, Soy Glaze, Olive Oil Sheen.
      - Cosmetics: Face Serum, Body Lotion, Hair Gel, Lip Gloss, Liquid Foundation, Nail Polish, Pearl Shampoo, Condensation.
      - Industrial: Wet Paint, Motor Oil, Engine Grease, Epoxy Resin, Molten Copper, Quicksilver Beads.
      - FX: Fresh Blood, Old Blood, Toxic Ooze, Alien Goo, Black Goo, Ectoplasm, Lava Flow, Candle Wax.

  - type: feature
    kicker: Interface
    title: Everything in one sidebar tab
    text:
      - The **DripLab** tab in the 3D Viewport sidebar holds the preset gallery with previews, the Add Fluid and Pour buttons, Shot Recipes, the Simulation panel and Product Studio, and every setting of the selected fluid. The presets are also in the Asset Browser, ready to drag onto an object.
      - A bake is safe in the panel. Its physics lock once it is baked, since changing them would delete it; **Free Bake** asks first, then you change them and bake again.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/driplab/interface.jpg
      alt: Blender with a baked lotion pour on a face cream jar and the DripLab Simulation panel open

