  - 9: skeleton types
  - 308: animations
  - 46: hand props
  - 24: rig checks before export

sections:
  - type: features
    kicker: Key features
    title: From a still mesh to motion in one panel
    items:
      - Joints found for you: The Human skeleton finds the hips, knees, shoulders, elbows, wrists, spine, neck and head from the silhouette, in a T-pose or an A-pose, under coats, skirts and helmets.
      - Real fingers: Fingertips and the webs between them are found on the hand itself, so every finger gets its own joints, also on mitten and mannequin hands.
      - Nine skeleton types: Human, Quadruped, Horse, Bird, Dragon, Kaiju, Spider, Snake and Shark. Legged creatures get their legs, head and tail lined up with your model.
      - Clean weights on messy models: Binding works on a closed stand-in of the body, so holes, overlapping pieces and many separate parts cannot break it. Clothes copy the weights of the skin under them; helmets and eyes follow one bone.
      - Bone Colors: Every bone paints its own area, so you see at a glance which bone moves which part.
      - A live motion library: 308 animations as moving cards, with search, tags, Mirror, In Place and several clips added at once.
      - Hands that hold: 46 swords, axes, shields, bows, pistols, rifles and tools. The fingers close on the prop, measured on the character's own skin, in every clip.
      - Aim Stance and Both Hands: A rifle stays in the shoulder with its barrel level, and the free hand stays on the fore-end, whatever the clip does with the arms.
      - Animator controls: IK/FK with snapping, foot roll, finger curl, shoulders that rise with the arm, IK legs for animals and sliders for tails, wings, necks and jaws.
      - Joints that keep their shape: Helper bones keep elbows, knees, shoulders and hips round, and twist bones stop a turned wrist from wringing the forearm.
      - Import Animation: Bring Mixamo downloads, other FBX files, BVH motion capture or an animated armature onto your character.
      - Check and export: 24 checks with one-click fixes, then presets for Unreal Engine 5, Unity (Humanoid), Godot (GLB) and generic FBX.

