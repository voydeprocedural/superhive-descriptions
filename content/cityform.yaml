  - type: specs
    kicker: Inside
    title: What the city is made of
    items:
      - Downtown: Glass, concrete-frame, stone and ribbon-window towers in seven plan shapes, with setbacks, fins, crowns, plant rooms, helipads and spires, and street floors of shops and lobbies.
      - Mid-rise and shops: Perimeter blocks of nine building types, with balconies, bays, shopfronts and awnings, fire escapes and named shop signs; gardens and rear buildings in the courtyards.
      - Suburbs: Houses with gable, hip and flat roofs, garages, porches, fences, hedges, pools and decks.
      - Parks: Paths, fountains, benches, lamps and a fenced playground, with trees grown from branches with real leaves.
      - Public places: A market with striped stalls, a floodlit football pitch, tennis and basketball courts, a sports hall, a supermarket, a filling station, a school and a car park, set in among the blocks.
      - City edge: Apartment blocks with balconies, sheds and warehouses, street trees, then fields and hedgerows into the haze.
      - Textures: Photographed CC0 textures from Poly Haven and ambientCG for walls, roofs, roads, pavements and lawns, with grime, dust and per-building variety.

  - type: steps
    kicker: Quick start
    title: Your first city
    items:
      - "In Blender, go to Edit > Preferences > Get Extensions, open the drop-down menu, choose **Install from Disk** and pick `cityform-1.0.0.zip`."
      - A **Cityform** tab appears in the 3D Viewport sidebar (press N).
      - Click **Add City**. A city with a river takes about ten seconds on a recent PC.
      - Pick a **Style**, then a **Sky** and click **Set Sky & Light**.
      - Place your camera and render, or click **Real-time Look** and fly around in EEVEE.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Are cars and people included?": "Not as part of the look. A new city has empty streets, ready for your own models: give the **Parked Vehicles** input of a district a collection with your cars, one object per car. The sliders also bring in simple built-in stand-ins, which are meant for blocking out, not for close-ups."
      - "Will a whole city slow my viewport down?": "Set **Viewport Quality** to Balanced or Light while you work: Light shows plain boxes. Renders always show everything, and level of detail follows the camera."
      - "Cycles or EEVEE?": "Both. The materials, the haze and the night lighting work in each."
      - "Which Blender versions?": "Blender 5.2 or newer. Cityform uses modifier features that are new in 5.2."
      - "Can I change the layout?": "Yes. Each face of a district object is a block that you can move or reshape in Edit Mode, or draw your own roads and use From Roads."
      - "Can I use it in commercial work?": "Yes, your renders and animations are yours. The building kit, textures and skies are CC0."

