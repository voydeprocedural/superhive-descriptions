  src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/forest-floor.jpg
  alt: A low view across ferns, fallen logs and dead leaves towards tall trunks in golden fog

stats:
  - 5: ready-made biomes
  - 160+: CC0 asset variants included
  - 7x: faster viewport with the budget on a 5 million instance scene

