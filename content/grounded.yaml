  - type: specs
    kicker: Performance
    title: Fast by default, full detail in the render
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/budget.gif
      alt: The viewport budget is typed into the sidebar, the field thins out, and Camera View Only spends the same budget on what the camera sees
    text:
      - Measured on a 1 km by 1 km terrain with the Wildflower Meadow biome, Blender 5.2, Ryzen 7 3700X, RTX 4060. Times are for updating every layer in the viewport.
    items:
      - Everything, what the render gets: 5,044,658 instances, 8.3 s.
      - Viewport budget 400,000 (default): 334,234 instances, 1.1 s.
      - Budget and camera view only: 313,073 instances, 1.7 s.

  - type: chips
    kicker: Perfect for
    title: Where it fits
    items: [Landscapes and environments, Architectural visualization, Game and film backgrounds, Street and city dressing, Product and diorama ground, Animated scenes with wind]

  - type: steps
    kicker: Installation
    title: Up and running in a minute
    items:
      - Download the zip from your Superhive library. Do not unzip it.
      - In Blender open Edit, Preferences, Get Extensions, the menu at the top right, Install from Disk, and pick the zip.
      - Open the sidebar in the 3D viewport with N and click the Grounded tab.
      - Select your ground, pick a biome and click Add Biome. For your own assets, select them, then the ground last, and click Scatter Selected or Auto Ecosystem.

  - type: faq
    kicker: FAQ
    title: Questions
    items:
      - "Do I need Grounded to render my scenes?": No. Every setting lives in a Geometry Nodes modifier saved in your file, so it renders the same on a render farm or another computer.
      - "Will it slow down my viewport?": The viewport budget caps what the viewport shows (400,000 by default, shared between layers) while renders get everything. Camera culling, thinning and box or point display help on very large scenes.
      - "Which Blender versions are supported?": Blender 5.0 and newer. It is tested on 5.0, 5.1 and 5.2.
      - "Can I use my own assets?": Yes. Select any meshes or collection instances, then the surface, and use Scatter Selected or Auto Ecosystem. Each asset keeps its own rotation and scale.
      - "Does it work with Cycles and EEVEE?": Yes, the result is regular instances that both engines render.
      - "Can I use the included assets commercially?": Yes. The included models and textures are CC0 (Poly Haven, ambientCG) or made by Voyde Procedural, free to use in commercial work.
      - "Can I make my own biomes?": Yes. Set up layers on a surface, click Save as Biome, and it appears in the biome picker in every file. Copy its two files to share it.

  - type: facts
    kicker: Details
    title: What you get
    cards:
      - title: Included
        items:
          - Grounded add-on (Blender extension)
