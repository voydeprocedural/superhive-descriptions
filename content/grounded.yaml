  src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/meadow.jpg
  alt: A grass and wildflower meadow at sunrise, with mist in the valley and dark forest on the far slope
video: umlmwC3-b04

stats:
  - 12: ready-made biomes
  - 395: models in 164 assets
  - 384: of those models are CC0
  - 8x: faster updates with the viewport budget on a 5 million instance scene

sections:
  - type: gallery
    kicker: One click
    title: From bare ground to a finished scene
    text:
      - This is the Blender viewport in Material Preview. Pick a biome, click Add Biome, and every layer, rule and wind setting comes with it. The wait is cut from these clips; the time on screen is what it took on a Ryzen 7 3700X and an RTX 4060.
    items:
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/apply-meadow.gif
        alt: A bare hill in a forest valley turns into a wildflower meadow in the Blender viewport after a click on Add Biome
        caption: Wildflower Meadow
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/apply-forest.gif
        alt: Bare earth fills with ferns, fallen logs and trunks, then the ground turns into dark humus with Blend Ground
        caption: Forest Floor, with Blend Ground
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/apply-desert.gif
        alt: An empty sand dune fills with orange flowers, boulders and quiver trees in the Blender viewport
        caption: Desert Bloom
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/apply-rocky.gif
        alt: A bare hillside of rock ledges gets boulders, stones, dry grass and pebbles in the Blender viewport
        caption: Rocky Slope

  - type: features
    kicker: Key features
    title: A whole environment from one panel
    items:
      - Twelve biomes: Meadow, forest floor, rocky slope, desert, autumn street, pine forest, woodland, savanna, tropical shore, moon, wetland and coral reef, each built from linked layers you can change.
      - Smart Terrain: One click reads your land and fills water lines, slopes, flats and rocky ground with layers that follow it.
      - Live rules: Slope, height, facing, ridges and hollows, patches, open sky, image and vertex masks, Color ID maps, keep away from objects, clear or follow paths.
      - Layers that relate: Grass keeps clear of trunks and rocks, flowers fill the gaps, and any layer can grow toward another or keep away from it.
      - Gathering: Leaves at the base of walls, pebbles in hollows and corners, litter under trees, weeds along path edges.
      - Season and weather: One slider each for season, snow and wetness, in Cycles and EEVEE. Keyframe them and they render without the add-on.
      - Paint and edit: Paint where a layer grows, erase it, place single instances, then move, turn, scale or remove any one of them. A new seed leaves your edits where they are.
      - Physics Drop: Instances fall and settle like real objects. No simulation stays in your file.
      - Viewport budget: One number caps what the viewport shows; renders always get the full density. Rules you don't use cost nothing.
      - Living wind: One wind for the whole scene. Grass and flowers bend, on library trees only the leaves move and the trunks stand still.

  - type: feature
    kicker: Smart Terrain
    title: One click reads the land
    text:
      - Grounded bakes maps from your terrain and adds library layers that follow it. Reeds and flowers along the water lines, forest with ferns on the slopes, grass on the flats, boulders on sharp crests and steep ground. The zones fade into each other, and the result is plain layers you can tune or delete.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/smart.gif
      alt: Seen from above, a bare terrain fills with forest, grass and rocks that follow its slopes and water lines

  - type: feature
    kicker: Biome Blend
    title: A forest that thins into a meadow
    text:
      - Two biomes fade into each other instead of stopping at a line. The edge follows a direction, a curve or your paint, with a soft width and some noise so it wanders.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/blend.gif
      alt: A pine forest fades out across a meadow along a soft, uneven edge

  - type: gallery
    kicker: Season and weather
    title: One slider, the whole scene
    text:
      - Season, Snow and Wetness are scene values that every material reads by itself. Only green parts of a texture turn, so flowers, bark and rocks stay as they are. Snow lies on what faces up, whichever way an instance is turned. Library assets have it built in, and one click adds it to your own.
    items:
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/season.gif
        alt: The Season slider moves in the Grounded sidebar and a green meadow turns brown and yellow
        caption: Season
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/snow.gif
        alt: The Snow slider moves and white covers the upward faces of the plants on a meadow
        caption: Snow
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/wet.gif
        alt: A brick street turns dark and glossy as wetness rises, with leaves and litter along the curb
        caption: Wetness

  - type: feature
    kicker: Brush
    title: Paint where it grows
    text:
      - Paint a layer onto the ground, erase it anywhere, or place single instances under the cursor. Strokes live in hidden helper objects, so your model never changes and any mesh resolution works.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/brush.gif
      alt: A brush stroke in the Blender viewport paints a band of wildflowers across a grassy hill

  - type: feature
    kicker: Rules
    title: Every rule stays live
    text:
      - Drag a setting and the layer follows in the viewport. Slope, height, facing direction, patches, masks and clear paths stack up, and every rule has a soft edge.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/rule.gif
      alt: The Coverage slider moves in the Grounded sidebar and wildflowers spread over the hill

  - type: feature
    kicker: Gathering
    title: Litter goes where it would really end up
    text:
      - Real ground isn't random. Leaves blow into corners and against walls, gravel rolls into ditches, needles fall under trees. Grounded's gathering rules make a layer denser in those places, or let it appear only there.
      - In the Autumn Street biome maple and oak leaves pile up in the gutter and along the walls, litter collects at the curb and weeds grow only in the cracks. Pick your own walls with one click.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/gather.gif
      alt: In the Blender viewport the Gathering strength goes up and autumn leaves pile up along the curb of a brick street

  - type: pair

  - type: feature
    kicker: Layers that relate
    title: Ground that looks grown, not sprinkled
    text:
      - Plants come in groups. One layer can grow toward another or keep away from it, and Bare Ground opens clearings at the same spots on every layer, so grass, flowers and clover leave the same ground free.
      - Blend Ground turns the soil into damp humus under the leaves, with bare earth between the drifts.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/clearings.gif
      alt: The Bare Ground setting goes up on every layer of a meadow and a clearing opens on the hill

  - type: gallery
    kicker: Arrangement
    title: Rows, clumps and paths
    text:
      - Lay straight rows for fields and orchards, or put them along curves for fences and vineyards. Clumps turn every point into a parent with children around it, for tussocks, reeds and mushroom rings. Draw a curve and every layer clears the lane, or follows it.
    items:
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/rows.gif
        alt: Straight rows of plants across a green valley floor move closer together
        caption: Rows
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/clumps.gif
        alt: Dry grass stands in tussocks on bare, cracked ground
        caption: Clumps
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/paths.gif
        alt: A winding lane opens through the plants of a meadow along a curve
        caption: Paths

  - type: gallery
    kicker: By hand
    title: Move one, drop a hundred
    text:
      - Physics Drop lets instances fall and settle. Rocks roll into hollows and rest against each other, and no simulation stays in your file. Any single instance can be moved, turned, scaled or removed by hand. It remembers its place when you change the seed, the density or a rule, and the layer changes around it.
    items:
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/drop.gif
        alt: Rocks fall into a pit in the ground and settle against each other
        caption: Physics Drop
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/move.gif
        alt: One boulder is selected in a desert scene and moved by hand across the sand
        caption: Hand edits

  - type: feature
    kicker: Natural variation
    title: Dry patches, not one flat green
    text:
      - Dryness turns plants yellow in patches and leaves flowers and bark alone. Every plant comes out a little lighter or darker than its neighbour, and the undersides of leaves come out paler.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/dryness.gif
      alt: Dryness goes up on the grass layers and the grass turns from green to yellow in patches

  - type: feature
    kicker: Grow In
    title: Grow a scene on the timeline
    text:
      - Instances rise from the ground over the frames you choose, one by one or in a wave that crosses the surface from any object. Grass doesn't jump around a tree that is still small, and layers that don't grow stay out of the way on a frame change.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/grow.gif
      alt: Pine trees and ferns rise from bare ground in a wave until a forest stands in the low sun

  - type: feature
    kicker: Living wind
    title: One wind for the whole scene
    text:
      - Gusts sweep across the ground in the wind direction. Grass, flowers and shrubs bend, and on library trees only the leaves move while the trunks stand still. It is on by default in every biome and keeps working without the add-on.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/wind.gif
      alt: Grass and flowers on a hill move in the wind

  - type: gallery
    kicker: Biomes
    title: Twelve worlds to start from
    text:
      - Every biome is a set of ordinary layers. Change the density, swap assets or paint over them. These are Cycles renders of the biomes. Terrains and skies in these images are not part of the add-on.
