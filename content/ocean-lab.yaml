        caption: EEVEE. The seabed and a sunken crate show through the shallow water, and foam gathers along the shore.
      - src: https://voydeprocedural.github.io/superhive-descriptions/media/ocean-lab/live.jpg
        alt: A wooden crate coming back up through a ring of foam and droplets after its fall into the bay, a life ring drifting towards it
        caption: Live Float. A crate dropped from four metres comes back up, moved by physics, with foam and droplets where it hit.
