        caption: "**Snow and ice:** Powder Snow, Packed Snow, Icy Snow Blend, Frosted Ice"

  - type: steps
    kicker: Quick start
    title: From the Asset Browser to your scene
    items:
      - Open the provided `.blend` file.
      - Use the **Asset Browser** or the material previews.
      - Apply a material to your object.
      - Adjust its parameters in the **UI control panel**.

  - type: facts
    kicker: Details
    title: What you get
    cards:
      - title: Included
        items:
          - 14 procedural materials in four groups - hard surfaces, soils, sand and moss, snow and ice
          - A UI control panel (node group) for each material
          - Asset Browser and material previews
      - title: Compatibility
        items:
          - Blender 4.0 to 5.0
          - "Render engine: Cycles"
