# Long description of Nature Starter Pack. Text kept from the Superhive description of 2026-11-02
# (archive/2026-11-02/nature-starter-pack.html), restructured into the shared layout. The description has no
# images, so the pictures are the product's Superhive gallery images.

headline: A lightweight, easy-to-use collection of stylized natural assets, designed for fast scene building.
intro:
  - "**Nature Starter Pack** includes a variety of trees, bushes, grass, flowers and rocks that work well for stylized environments, game scenes and background setups."
  - All assets are organized into a simple, clean panel for quick access inside Blender.
chips: [Stylized assets, Lightweight geometry, Organized asset panel, Cycles & EEVEE]
