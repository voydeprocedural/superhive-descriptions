  - type: steps
    kicker: Installation
    title: Up and running in a minute
    items:
      - Download terrain_lab-0.4.0.zip. Do not unzip it.
      - Drag it into Blender, or use Edit > Preferences > Get Extensions > Install from Disk.
      - Open the 3D Viewport sidebar (N) and the TerrainLab tab, pick a preset and click New Terrain.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Does it need World Creator, Gaea or another program?": No. Everything happens inside Blender.
      - "Does erosion have to be baked again when I reopen the file?": No. The result is stored in the .blend file. Simulate again only after changing the shape.
      - "Can I render on a farm or send the file to someone without the add-on?": Yes. It is plain Geometry Nodes and shader nodes.
      - "Does it work in EEVEE?": Yes, in the viewport and in final renders.
      - "Can I use my own heightmaps?": Yes, as a layer (16-bit PNG, EXR, TIFF). Erode, blend and texture them like any other layer.
      - "Does it scatter trees and rocks?": No, TerrainLab leaves scattering to dedicated tools.
      - "Can I use it commercially?": Yes. Terrains and exported files are yours for any project.

