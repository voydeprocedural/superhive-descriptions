<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crawlers: a spider that follows your cursor</title>
<link rel="stylesheet" href="../w/tokens.css">
<link rel="stylesheet" href="../w/widget.css">
<style>
  /* Embedded in the Crawlers description (content/crawlers.yaml, type: embed) at 960 x 360. */
  body { cursor: none; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .label { position: absolute; left: 2.6rem; top: 2.2rem; font-size: 1.25rem; color: var(--brand-bright); pointer-events: none; }
  .hint {
    position: absolute; left: 50%; bottom: 2.4rem; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    font-size: 1.4rem; color: var(--brand-soft); letter-spacing: 0.14em; transition: opacity 0.8s;
  }
  .hint.gone { opacity: 0; }
  .short { display: none; }
  /* Narrow columns get bigger text; touch screens (no cursor) get a shorter hint about tapping. */
  @media (max-width: 560px) { .label { font-size: 2rem; } .hint { font-size: 1.7rem; letter-spacing: 0.08em; } }
  @media (hover: none) { .long { display: none; } .short { display: inline; } .hint { font-size: 2.2rem; } }
</style>
</head>
<body>
<canvas id="c" aria-label="An animated spider that walks toward your cursor"></canvas>
<p class="label mono">Crawlers &middot; wolf spider</p>
<p class="hint mono" id="hint"><span class="long">Move your cursor here &middot; it follows &middot; click to startle it</span><span class="short">Tap anywhere &middot; it walks there</span></p>
<div class="frame"></div>
<script>
// A procedural spider: eight two-joint legs that step in two alternating groups, a body that steers toward
// the cursor (or wanders when there is none) and bolts away from a click. On touch screens a tap sends it to that
// spot instead. Everything scales with the iframe width.
(() => {
  const css = getComputedStyle(document.documentElement);
  const LINE = css.getPropertyValue('--brand-bright').trim() || '#bf5fff';
  const SOFT = css.getPropertyValue('--brand-soft').trim() || '#dcc2ff';
  const cv = document.getElementById('c'), g = cv.getContext('2d');
  const hint = document.getElementById('hint');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, k = 1, dpr = 1;
  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight; k = W / 960;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }

  // Legs in the body frame (x forward, y to the right), mirrored for the left side.
  // hip: where the leg leaves the body; rest: where the foot sits when standing; a/b: thigh and shin length.
  const LEGS = [
    { hip: [10, 6], rest: [70, 52], a: 46, b: 52 },
    { hip: [5, 8], rest: [26, 74], a: 40, b: 46 },
    { hip: [-1, 8], rest: [-18, 74], a: 40, b: 46 },
    { hip: [-6, 6], rest: [-64, 58], a: 48, b: 56 },
  ];
  const legs = [];
  LEGS.forEach((d, i) => [1, -1].forEach(side => legs.push({
    ...d, side, group: (i + (side > 0 ? 0 : 1)) % 2,
    foot: [0, 0], from: [0, 0], to: [0, 0], t: 1,
  })));

  const sp = { x: 0, y: 0, h: 0, v: 0 };
  let pointer = null, goal = null, restUntil = 0, fleeUntil = 0, interacted = false;

  const toWorld = (bx, by, lead = 0) => {
    const c = Math.cos(sp.h), s = Math.sin(sp.h);
    const x = (bx * k) + lead, y = by * k;
    return [sp.x + x * c - y * s, sp.y + x * s + y * c];
  };
  const restOf = (l, lead) => toWorld(l.rest[0], l.rest[1] * l.side, lead);
  const hipOf = l => toWorld(l.hip[0], l.hip[1] * l.side);

  function place() {
    sp.x = W * 0.3; sp.y = H * 0.55; sp.h = -0.3; sp.v = 0;
    legs.forEach(l => { l.foot = restOf(l, 0); l.t = 1; });
    goal = wanderPoint();
  }
  function wanderPoint() {
    const m = 90 * k;
    return [m + Math.random() * (W - 2 * m), m + Math.random() * (H - 2 * m)];
  }

  const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  function touched() { if (!interacted) { interacted = true; setTimeout(() => hint.classList.add('gone'), 2500); } }
  addEventListener('pointermove', e => { if (e.pointerType !== 'touch') { pointer = local(e); touched(); } });
  addEventListener('pointerleave', () => { pointer = null; goal = wanderPoint(); });
  addEventListener('pointerdown', e => {
    const [px, py] = local(e); touched();
    if (e.pointerType === 'touch') { goal = [px, py]; restUntil = 0; rings.push({ x: px, y: py, t: 0 }); return; }
    const away = Math.atan2(sp.y - py, sp.x - px);
    goal = [Math.max(60 * k, Math.min(W - 60 * k, sp.x + Math.cos(away) * 380 * k)),
            Math.max(60 * k, Math.min(H - 60 * k, sp.y + Math.sin(away) * 380 * k))];
    fleeUntil = performance.now() + 900;
    rings.push({ x: px, y: py, t: 0 });
  });
  const rings = [];

  function step(dt, now) {
    const fleeing = now < fleeUntil;
    const chasing = pointer && !fleeing;
    const target = chasing ? pointer : goal;
    const dx = target[0] - sp.x, dy = target[1] - sp.y, d = Math.hypot(dx, dy);
    const near = (chasing ? 70 : 18) * k;
    let want = 0;
    if (d > near && now > restUntil) {
      const turn = Math.atan2(Math.sin(Math.atan2(dy, dx) - sp.h), Math.cos(Math.atan2(dy, dx) - sp.h));
      sp.h += Math.max(-1, Math.min(1, turn)) * dt * (fleeing ? 5 : 3.2);
      const top = fleeing ? 520 : chasing ? 210 : 95;
      want = top * k * Math.min(1, (d - near) / (120 * k)) * (0.35 + 0.65 * Math.max(0, Math.cos(turn)));
    } else if (!chasing && !fleeing && d <= near) {
      restUntil = now + 500 + Math.random() * 1800;   // stand still for a moment, then pick a new spot
      goal = wanderPoint();
    }
    sp.v += (want - sp.v) * Math.min(1, dt * (fleeing ? 10 : 5));
    sp.x = Math.max(30 * k, Math.min(W - 30 * k, sp.x + Math.cos(sp.h) * sp.v * dt));
    sp.y = Math.max(30 * k, Math.min(H - 30 * k, sp.y + Math.sin(sp.h) * sp.v * dt));

    // Gait: a foot steps when it lags too far behind its rest spot, and only while the other group is planted,
    // unless it is so far behind (a sharp turn) that waiting would cross the legs.
    const lead = sp.v * 0.16;
    const duration = Math.max(0.06, 0.15 - sp.v / (3000 * k));
    const busy = [0, 0];
    legs.forEach(l => { if (l.t < 1) busy[l.group]++; });
    for (const l of legs) {
      if (l.t < 1) {
        l.t = Math.min(1, l.t + dt / duration);
        const e = l.t * l.t * (3 - 2 * l.t);
        l.foot = [l.from[0] + (l.to[0] - l.from[0]) * e, l.from[1] + (l.to[1] - l.from[1]) * e];
        continue;
      }
      const r = restOf(l, lead);
      const lag = Math.hypot(l.foot[0] - r[0], l.foot[1] - r[1]);
      if ((lag > 22 * k && busy[1 - l.group] === 0) || lag > 52 * k) {
        l.from = l.foot; l.to = r; l.t = 0; busy[l.group]++;
      }
    }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt * 1.6; if (rings[i].t >= 1) rings.splice(i, 1); }
  }

  // Two-bone leg: the knee bends away from the body, the foot lifts while stepping.
  function joints(l) {
    const [hx, hy] = hipOf(l);
    const A = l.a * k, B = l.b * k;
    const lift = l.t < 1 ? Math.sin(l.t * Math.PI) * 9 * k : 0;
    let fx = l.foot[0] - hx, fy = l.foot[1] - hy - lift;
    let d = Math.hypot(fx, fy);
    const max = (A + B) * 0.99;
    if (d > max) { fx *= max / d; fy *= max / d; d = max; }
    const bend = Math.acos(Math.max(-1, Math.min(1, (A * A + d * d - B * B) / (2 * A * Math.max(d, 1e-3)))));
    const ang = Math.atan2(fy, fx) - l.side * bend;
    return [hx, hy, hx + Math.cos(ang) * A, hy + Math.sin(ang) * A - lift * 0.5, hx + fx, hy + fy];
  }

  function draw(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, H);
    g.lineCap = 'round'; g.lineJoin = 'round';

    // shadow on the ground
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(sp.x + 6 * k, sp.y + 10 * k, 46 * k, 30 * k, sp.h, 0, Math.PI * 2); g.fill();

    // click rings and the cursor reticle
    g.strokeStyle = LINE;
    for (const r of rings) {
      g.globalAlpha = 1 - r.t; g.lineWidth = 1.5 * k;
      g.beginPath(); g.arc(r.x, r.y, (10 + r.t * 60) * k, 0, Math.PI * 2); g.stroke();
    }
    g.globalAlpha = 1;
    if (pointer) {
      g.lineWidth = 1.2 * k; g.globalAlpha = 0.8;
      g.beginPath(); g.arc(pointer[0], pointer[1], 9 * k, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(pointer[0], pointer[1], 2 * k, 0, Math.PI * 2); g.fillStyle = LINE; g.fill();
      g.globalAlpha = 1;
    }

    g.shadowColor = LINE; g.shadowBlur = 12 * k;
    g.strokeStyle = LINE; g.fillStyle = LINE;
    for (const l of legs) {
      const [hx, hy, kx, ky, fx, fy] = joints(l);
      g.lineWidth = 3 * k; g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky); g.stroke();
      g.lineWidth = 1.7 * k; g.beginPath(); g.moveTo(kx, ky); g.lineTo(fx, fy); g.stroke();
      g.beginPath(); g.arc(kx, ky, 2.2 * k, 0, Math.PI * 2); g.fill();
    }

    g.save(); g.translate(sp.x, sp.y); g.rotate(sp.h);
    const breathe = 1 + Math.sin(now / 420) * 0.025;
    // abdomen with a chevron pattern, like a wolf spider's
    g.lineWidth = 2 * k;
    g.beginPath(); g.ellipse(-30 * k, 0, 25 * k * breathe, 18 * k * breathe, 0, 0, Math.PI * 2);
    g.globalAlpha = 0.22; g.fill(); g.globalAlpha = 1; g.stroke();
    g.lineWidth = 1.2 * k; g.globalAlpha = 0.75;
    for (let i = 0; i < 4; i++) {
      const x = -16 * k - i * 8 * k, w = (9 - i * 1.5) * k;
      g.beginPath(); g.moveTo(x - 4 * k, -w); g.lineTo(x, 0); g.lineTo(x - 4 * k, w); g.stroke();
    }
    g.globalAlpha = 1;
    // head and thorax
    g.lineWidth = 2 * k;
    g.beginPath(); g.ellipse(2 * k, 0, 15 * k, 12 * k, 0, 0, Math.PI * 2);
    g.globalAlpha = 0.3; g.fill(); g.globalAlpha = 1; g.stroke();
    // palps
    g.lineWidth = 1.6 * k;
    for (const s of [1, -1]) {
      g.beginPath(); g.moveTo(14 * k, s * 4 * k); g.quadraticCurveTo(24 * k, s * 8 * k, 25 * k, s * 2 * k); g.stroke();
    }
    // eyes: two large front eyes and a row of small ones
    g.shadowColor = SOFT; g.shadowBlur = 10 * k; g.fillStyle = '#ffffff';
    for (const [ex, ey, r] of [[11, 3.2, 2], [11, -3.2, 2], [7, 6.5, 1.3], [7, -6.5, 1.3], [13.5, 1.2, 1], [13.5, -1.2, 1]]) {
      g.beginPath(); g.arc(ex * k, ey * k, r * k, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    g.shadowBlur = 0;
  }

  let visible = true, last = performance.now(), placed = false;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(document.body);
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (W && H && visible) {
      if (!placed) { place(); placed = true; }
      if (!still) step(dt, now);
      draw(now);
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', () => { fit(); placed = false; });
  fit();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
