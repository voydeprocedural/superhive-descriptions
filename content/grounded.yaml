  - type: features
    kicker: Key features
    title: A whole environment from one panel
    items:
      - Biomes: Wildflower meadow, forest floor, rocky slope, desert bloom and autumn street, each built from linked layers you can change.
      - Auto Ecosystem: Select any assets and the surface; Grounded sorts them into trees, shrubs, ground cover, rocks and litter, sets density from their size and links the layers.
      - Rules: Slope, height, facing direction, natural patches, shared clearings, vertex group and image masks, material filter, keep away from objects, clear paths along curves.
      - Layers that relate: Grass keeps clear of trunks and rocks, and any layer can grow toward another or keep away from it.
      - Gathering: Leaves at the base of walls, pebbles in hollows and corners, litter under trees, weeds along path edges.
      - Natural variation: Weight each asset to make it common or rare. Dryness turns plants yellow in patches, and every plant comes out a little lighter or darker than its neighbour.
      - Paint brush: Paint where a layer grows, erase it anywhere, or place single instances under the cursor.
      - Viewport budget: One number caps what the viewport shows; renders always get the full density. Camera culling and thinning help on very large scenes.
      - Living wind: One wind for the whole scene. Gusts sweep across the ground in the wind direction, grass bends more than trees, leaves flutter. On by default in every biome.
      - Bake and share: Save your layers as your own biome, turn a layer into a real mesh, export every instance to CSV for game engines, copy settings between layers.

  - type: feature
    kicker: Brush
    title: Paint where it grows
    text:
      - Paint a layer onto the ground, erase it anywhere, or place single instances under the cursor. Strokes live in hidden helper objects, so your model never changes and any mesh resolution works.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/brush.gif
      alt: A brush stroke in the Blender viewport paints a band of wildflowers across a grassy hill

  - type: feature
    kicker: Rules
    title: Every rule stays live
    text:
      - Drag a setting and the layer follows in the viewport. Slope, height, facing direction, patches, masks and clear paths stack up, and every rule has a soft edge.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/rule.gif
      alt: The Coverage slider moves in the Grounded sidebar and wildflowers spread over the hill

  - type: feature
    kicker: Gathering
    title: Litter goes where it would really end up
    text:
      - Real ground isn't random. Leaves blow into corners and against walls, gravel rolls into ditches, needles fall under trees. Grounded's gathering rules make a layer denser in those places, or let it appear only there.
      - In the Autumn Street biome maple and oak leaves pile up in the gutter and along the walls, litter collects at the curb and weeds grow only in the cracks. Pick your own walls with one click.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/gather.gif
      alt: In the Blender viewport the Gathering strength goes up and autumn leaves pile up along the curb of a brick street

  - type: pair

  - type: feature
    kicker: Layers that relate
    title: Ground that looks grown, not sprinkled
    text:
      - Plants come in groups. One layer can grow toward another or keep away from it, and Bare Ground opens clearings at the same spots on every layer, so grass, flowers and clover leave the same ground free.
      - Blend Ground turns the soil into damp humus under the leaves, with bare earth between the drifts.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/clearings.gif
      alt: The Bare Ground setting goes up on every layer of a meadow and a clearing opens on the hill

  - type: feature
    kicker: Natural variation
    title: Dry patches, not one flat green
    text:
      - Dryness turns plants yellow in patches and leaves flowers and bark alone. Every plant comes out a little lighter or darker than its neighbour, and the undersides of leaves come out paler.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/dryness.gif
      alt: Dryness goes up on the grass layers and the grass turns from green to yellow in patches

  - type: feature
    kicker: Living wind
    title: One wind for the whole scene
    text:
      - Gusts sweep across the ground in the wind direction, grass bends more than trees and leaves flutter. It is on by default in every biome and keeps working without the add-on.
      - This clip was recorded frame by frame from the viewport.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/grounded/wind.gif
      alt: Grass and flowers on a hill move in the wind

