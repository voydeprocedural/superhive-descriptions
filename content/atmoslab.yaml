  - type: feature
    kicker: One click
    title: Try a look, keep the one you like
    text:
      - Pick a look in the gallery and click **Apply Preset**. The fog, the sky and the light change together in the viewport, while your fog box and the direction of your sun stay where they are.
      - Every value stays yours. Open **Fog** or **Sky & Sun** and drag any field, and the viewport follows.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/presets.gif
      alt: The AtmosLab panel in Blender switching a forest road between Forest Sunbeams, Dense Horror Fog and Golden Dust

  - type: pair

  - type: feature
    kicker: Sun & sky
    title: A sun that always agrees with the sky
    text:
      - Move **Elevation** or **Rotation** and the sky, the sun disc and the AtmosLab Sun lamp change together. The lamp's colour and strength were measured from Blender's sky model, so shadows and light shafts always match the sky behind them, from midday to the last red light.
      - Keyframe the sun for a time-lapse. Below the horizon the sky fades through twilight to night, and the stars come out.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/sun.gif
      alt: The Sun Rotation field dragged in the AtmosLab panel while golden sunbeams swing through the trees along a forest road

  - type: feature
    kicker: Time & Place
    title: The real sky of any day, anywhere
    text:
      - Turn on **Use Date and Place**, then enter a date, a time, a latitude and a longitude, or press **Now** for this moment. The sun and the moon rise where they really rise, and the stars turn with the Earth.
      - Press **Play** to run the day forward. **Live Preview** lets the sky move in the viewport, so you can scrub through a sunset and watch the moon and stars come out. In a dense scene the shadows set the speed, so hide heavy collections while you set up the sky.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/time.gif
      alt: Play running in the AtmosLab panel while a forest road goes from a golden evening to a starry night

  - type: feature
    kicker: Night
    title: Moonlit nights with real phases
    text:
      - The moon uses the near side from NASA's CGI Moon Kit, lit by the sun, so it is full when it rises opposite the sunset and a thin crescent next to the sun. You can also place it anywhere by hand. The Moonlight lamp follows the phase and lights the fog.
      - Stars, a Milky Way band and a faint night glow complete the sky. Turn the star field for star motion.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/moonlit-fog.jpg
      alt: The moon and stars above a misty lake at night

  - type: feature
    kicker: Light shafts
    title: Sunlight you can see
    text:
      - Put the sun behind something and the beams appear on their own, because the fog really scatters the light. **Light Shafts** sets how strongly the fog glows when you look toward a light.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/forest-beams.gif
      alt: The camera moving slowly through sunbeams between tall fir trees

  - type: feature
    kicker: Ground fog
    title: Fog that hugs the ground
    text:
      - A ground layer with its own density, height and softness sits on top of the haze. Its top edge is broken up by noise and drifts with the wind, so it rolls between trees and around lamp posts.
      - Lamps inside the fog get soft halos on their own; **Light Shafts** controls how strongly the fog glows when you look toward a light.
    media:
      src: https://voydeprocedural.github.io/superhive-descriptions/media/atmoslab/fog-drift.gif
      alt: Ground fog drifting across a wet lane at dusk under a lantern

  - type: specs
    kicker: Fog controls
    title: Shape the air
    items:
      - Density and Haze Height: How thick the haze is at the ground and how quickly it thins out higher up.
      - Ground Fog: Density, height and softness of the layer on the ground.
      - Color and Absorption: Bluish aerial haze, warm dust or dark, smoky fog.
      - Light Shafts: Forward scattering for sunbeams and lamp halos, or 0 for an even haze.
      - Noise: Amount, size and detail of the fog patches.
      - Wind and Turbulence: Drift speed and direction, and how fast the patches change shape.
      - Edge Fade: Fades the fog at the sides and the top of the box, so the box never shows.
      - Fit to Scene: Sizes the fog box to everything visible and the camera, with the base on the ground.

  - type: specs
    kicker: Sky controls
    title: From noon to midnight
    items:
      - Sun Elevation and Rotation: Time of day and direction of the light.
      - Exposure and Auto Exposure: Brightness of the sky, the sun and the moonlight; your own lamps keep their power.
      - Air, Aerosols, Ozone, Altitude: The physical sky model.
      - Time & Place: Date, time, latitude, longitude, time zone and north direction.
      - Play and Live Clock: Run the day at any speed, or follow the real clock.
      - Stars and Milky Way: Brightness, density, size and rotation.
      - Moon: Position, size, brightness, glow and moonlight.
      - Night glow: Colour and brightness of the night sky.

  - type: chips
    kicker: Perfect for
    title: Where it helps
    items: [Landscape renders, Horror and thriller scenes, Exterior architecture, Fantasy environments, Animations and time-lapses, Game cinematics, Concept art]

  - type: steps
    kicker: Getting started
    title: Install and apply a look
    items:
      - "In Blender, go to **Edit > Preferences > Get Extensions**, open the **⌄** menu and choose **Install from Disk**. Pick `atmos_lab-0.1.0.zip`; no need to unzip it."
      - Press **N** in the 3D Viewport and open the **AtmosLab** tab.
      - Pick a look in the preset gallery and click **Apply Preset**.
      - Turn **Sun Rotation** until the light comes from where you want it, then click **Render > Optimize Render Settings**.

  - type: faq
    kicker: FAQ
    title: Good to know
    items:
      - "Does it work in EEVEE?": Yes, and it is fast for previews and animation. Cycles gives the most accurate fog. EEVEE lights fog mainly with lamps, so fog in the shade looks darker there. Optimize Render Settings sets EEVEE's volumetric range and detail for you.
      - "Will my scene still render on a render farm?": Yes. AtmosLab only uses nodes and simple drivers saved in the .blend, so the fog, sky and lamps work without the add-on and without Python auto-run.
      - "Does it change my materials?": No. The fog is a separate box object and the sky is its own world. Remove Sky brings your previous world back.
      - "Are the trees and rocks in the images included?": Only those in the two demo files, the lamp-lit lane and the misty lake. The add-on adds fog, sky and light to your own scenes. All of them are free CC0 models from Poly Haven.
      - "Is the sky really real time?": In the viewport, yes. With Live Preview on, the sky and fog follow every change. Our light demo scene runs at about 9 frames a second on an RTX 4060 at 2560 x 1360. How fluid it gets depends on your scene, because the shadows of everything in it are redrawn as the sun moves.
      - "How accurate are the sun and the moon?": They use the Astronomical Almanac's low-precision formulas. We checked them against an astronomy library at 2,000 random moments from 2000 to 2050, and the sun was never more than about 0.01 degrees off and the moon less than half a degree, about its own width. That is plenty for a render, but it is not meant for navigation.
      - "Does it work on big landscapes?": Yes. The presets suit scenes up to about a kilometre across; for mountains and valleys, lower the fog density and raise its height as the documentation explains.
      - "Does it make clouds?": No, AtmosLab is about the air in your scene. For volumetric clouds, see Cloud Sketch.
      - "Can I use my renders commercially?": Yes, everything you render with AtmosLab is yours.
      - "Which Blender versions are supported?": Blender 5.0 and newer. Blender 4.5 and older are not supported.

  - type: facts
    kicker: Details
    title: What you get
    cards:
      - title: Included
        items:
          - AtmosLab 0.1.0 Blender extension
          - Eight presets with a thumbnail gallery
          - Demo scene (the lamp-lit lane through a fir forest, three cameras)
          - Live Demo scene (a misty lake between fir trees, made for Live Preview)
          - Documentation
      - title: Compatibility
        items:
          - Blender 5.0 or newer
          - Tested on Blender 5.0, 5.1 and 5.2
          - Cycles and EEVEE
          - Pure Python and nodes, no platform-specific files
      - title: License
        items:
          - The add-on code is licensed under GPL-3.0-or-later.
          - Developed by Voyde Procedural, code written with AI assistance. No AI-generated images.

  - type: more
