      - src: https://assets.superhivemarket.com/store/productimage/1277032/image/xlarge_og-1ca3df78b1c8e28a99745a365140af08.png
        alt: A purple monkey head wrapped in bright blue electric arcs

  - type: chips
    kicker: Perfect for
    title: Where it fits
